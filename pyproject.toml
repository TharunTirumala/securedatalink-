[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securelink"
version = "1.0.0"
description = "Cyber-Secure Tactical Datalink System"
authors = [{ name = "Team SecureLink" }]
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "websockets>=11.0",
    "pytest>=7.0.0",
    "pymavlink>=2.4.40",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
